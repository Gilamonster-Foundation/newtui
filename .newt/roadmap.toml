[[tree.subtask]]
id = "node-m"
instruction = "Package M — the changeset review surface, the reason the IDE composition exists: a human reviewing an agent's changes before they land. Three components over one subject — the changeset view (package K over a change source), the diff view (package J over a hunk model with per-line add/remove/context), and the stage editor (stage/unstage/discard at file, hunk, or line granularity with per-file tri-state, plus the commit message form). It NEVER runs git: it returns intents (Stage/Unstage/Discard/Commit) and the host performs them. Discard is not the inverse of unstage — separate key, separate intent, because discard destroys working-tree changes. Acceptance: staging every hunk of a file leaves it fully staged and unstaging the last returns it to unstaged; a mixed file reports partial, never a boolean; discard emits a distinct intent; the component performs no I/O; exhausted:true over two files, three hunks, one partially staged. See docs/PLAN.md 'Package M'."
