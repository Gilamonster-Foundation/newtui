# CI for newtui — mirrors `just check`, one job per gate so a failure names
# itself. Keep in step with the justfile and .githooks/pre-push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Tests (both feature settings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--no-default-features` is the configuration a headless consumer gets,
      # and the one tests/leaf.rs proves has an empty closure. It has to pass.
      - run: cargo test --no-default-features
      - run: cargo test --all-features
      # Non-default by design, so it cannot disappear behind workspace defaults.
      - run: cargo test -p newtui-py
      - run: cargo test -p newtui-catalog

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy -p newtui-py --all-targets -- -D warnings
      - run: cargo clippy -p newtui-catalog --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p newtui-py --no-deps
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p newtui-catalog --no-deps

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so a new dependency cannot raise the real floor silently. The
      # declared rust-version is a claim; this job is what makes it true.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features --locked
      - run: cargo build -p newtui-py --all-targets --locked
      - run: cargo build -p newtui-catalog --all-targets --locked

  mutations:
    name: Expected-red (every guard catches a real defect)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Builds a mutated copy of the crate per row and asserts the named guard
      # goes RED. Without this job, every mutation table in this repo is prose.
      - run: cargo test --test mutations -- --nocapture

  coverage:
    name: Coverage floor (80% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # A floor, not a target — see the justfile recipe for why 80 and why
      # --all-features only. Its own job so a drop names itself instead of
      # hiding inside a test failure.
      - run: cargo llvm-cov --all-features --summary-only --fail-under-lines 80
      # The adapter is outside the default members and needs its own measured
      # floor; embedded Python tests let LLVM observe the PyO3 call paths.
      - run: cargo llvm-cov -p newtui-py --summary-only --fail-under-lines 80 --ignore-filename-regex 'newtui-py/tests/'
      - run: cargo llvm-cov -p newtui-catalog --summary-only --fail-under-lines 80

  python-coverage:
    name: Python API, examples and coverage (80% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install 'maturin>=1.9.4,<2' 'coverage>=7,<8'
      # Same script as `just check` and the hook fallback: the markdown
      # examples are executable product surface, not untested prose.
      - run: PYTHON=python scripts/check-python.sh

  leaf:
    name: Leaf invariant (empty runtime closure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The claim that lets newt, wyvern, gilamonster and a foreign TUI all
      # depend on this crate. Its own job so a failure says which invariant broke.
      - run: cargo test --test leaf
