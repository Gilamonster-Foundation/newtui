# CI for newtui — mirrors `just check`, one job per gate so a failure names
# itself. Keep in step with the justfile and .githooks/pre-push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Tests (both feature settings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--no-default-features` is the configuration a headless consumer gets,
      # and the one tests/leaf.rs proves has an empty closure. It has to pass.
      - run: cargo test --no-default-features
      - run: cargo test --all-features

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so a new dependency cannot raise the real floor silently. The
      # declared rust-version is a claim; this job is what makes it true.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features --locked

  mutations:
    name: Expected-red (every guard catches a real defect)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Builds a mutated copy of the crate per row and asserts the named guard
      # goes RED. Without this job, every mutation table in this repo is prose.
      - run: cargo test --test mutations -- --nocapture

  leaf:
    name: Leaf invariant (empty runtime closure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The claim that lets newt, wyvern, gilamonster and a foreign TUI all
      # depend on this crate. Its own job so a failure says which invariant broke.
      - run: cargo test --test leaf
