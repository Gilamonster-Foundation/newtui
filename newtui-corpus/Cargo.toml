[package]
name = "newtui-corpus"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Portable observable-behavior conformance for newtui components"
repository = "https://github.com/Gilamonster-Foundation/newtui"
readme = "README.md"

[dependencies]
newtui = { path = "..", version = "0.1.0", default-features = false }
content-addressable = "0.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
