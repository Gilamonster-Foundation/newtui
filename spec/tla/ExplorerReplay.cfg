\* ExplorerReplay — the HONEST world, at HEAD, with the bridge.
\*
\* GuardOn = TRUE: this configuration describes the crate AS SHIPPED on main.
\* The departure guard is `Explorer::replay_to` — every reconstruction is
\* compared against the fingerprint recorded at discovery, and a mismatch is
\* recorded as a `Divergence` and judged no further. It was S0 of the plan when
\* this file was written and `GuardOn = FALSE` was then the honest setting; it
\* has landed, and a cfg still describing the code before it would be a spec of
\* something nobody runs.
\*
\* WorldModes = {"free", "drain"}: BOTH are now bound by the bridge.
\* "free" is the pure factory. "drain" is the impure one the guard exists for —
\* the first product warm, every later one cold — and it became bindable when
\* the guard landed, because `gen_model` can now run the real explorer over a
\* draining factory and record what it does. That run is what stops
\* `GuardOn = TRUE` from being a description of unrun code: it says the crate
\* records one divergence, judges nothing past it, and leaves `exhausted`
\* alone, and the model has to compute the same five facts itself.
\*
\* "prewarmed" is NOT here. It is the residue, it is indistinguishable from
\* "free" from inside the run, and it has its own cfg — PrewarmedConsistent.cfg
\* green on ReplayIsConsistent, mutations/PrewarmedResidue.cfg red on
\* CoversColdReach. That pair is the statement that the guard does not close it.
\*
\* THE HISTORICAL BUG IS NOT HERE. Bug 3b lives in "drain" with the guard off,
\* and that configuration is RED: mutations/ReplayGuardOff.cfg. Its
\* counterexample is the artifact, and it is now a regression witness rather
\* than a description of live code. DepartureGuardCloses.cfg is the same world
\* with the guard on, and it is green — that pair is the argument that the fix
\* is load-bearing.
\*
\* DepthCaps = {1,3} is a DECOY, not tuning: at cap 1 the depth arm fires and
\* the run is honestly incomplete; at cap 3 an honest exhaustive run exists.
\* One cap alone makes one of the two unreachable and the invariants vacuous.
\* `mutations/HonestRunExists.cfg` is the executed proof that cap 3 reaches an
\* honest exhaustive run.
\*
\* Deadlock checking is ON (check.sh runs bare TLC); `Stutter` is guarded by
\* `done`, so only a genuinely stuck state is flagged.

SPECIFICATION Spec

CONSTANTS
    DepthCaps  = {1, 3}
    WorldModes = {"free", "drain"}
    GuardOn    = TRUE
    Narrow     = TRUE
    WarmStart  = "w0"

INVARIANTS
    CoversColdReach
    ReplayIsConsistent
    ModelMatchesRust
