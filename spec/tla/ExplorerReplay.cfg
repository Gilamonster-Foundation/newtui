\* ExplorerReplay — the HONEST world, at HEAD, with the bridge.
\*
\* GuardOn = FALSE: this configuration describes the crate AS SHIPPED at
\* 7f69a3d. The departure guard does not exist yet (it is S0 of the plan), and
\* a cfg that assumed it would be a spec of code nobody has written.
\*
\* WorldModes = {"free"}: the world where `factory()` returns the same machine
\* every time. This is the only world the BRIDGE can bind today —
\* `ModelMatchesRust` compares the model's own counters against a real
\* `Explorer::explore` run (spec/tla/RustObs.tla, generated by
\* `cargo run --example gen_model`), and a run in "drain" would need S0's guard
\* on the Rust side to agree.
\*
\* THE LIVE BUG IS NOT HERE. Bug 3b lives in "drain" with the guard off, and
\* that configuration is RED: mutations/ReplayGuardOff.cfg. Its counterexample
\* is the artifact. DepartureGuardCloses.cfg is the same world with the guard
\* on, and it is green — that pair is the argument that the S0 fix is
\* load-bearing.
\*
\* DepthCaps = {1,3} is a DECOY, not tuning: at cap 1 the depth arm fires and
\* the run is honestly incomplete; at cap 3 an honest exhaustive run exists.
\* One cap alone makes one of the two unreachable and the invariants vacuous.
\* `mutations/HonestRunExists.cfg` is the executed proof that cap 3 reaches an
\* honest exhaustive run.
\*
\* Deadlock checking is ON (check.sh runs bare TLC); `Stutter` is guarded by
\* `done`, so only a genuinely stuck state is flagged.

SPECIFICATION Spec

CONSTANTS
    DepthCaps  = {1, 3}
    WorldModes = {"free"}
    GuardOn    = FALSE
    Narrow     = TRUE
    WarmStart  = "w0"

INVARIANTS
    CoversColdReach
    ReplayIsConsistent
    ModelMatchesRust
