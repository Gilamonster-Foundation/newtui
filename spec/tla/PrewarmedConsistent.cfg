\* THE RESIDUE, green half.
\*
\* "prewarmed": something else in the process already drained the world, so
\* EVERY `factory()` call in this run returns the warm machine. The run is then
\* internally honest — it is the complete, correct report of a real machine.
\* GREEN.
\*
\* mutations/PrewarmedResidue.cfg is the SAME configuration asserting
\* CoversColdReach, and it is RED. Together: the report is a sound report of a
\* component the consumer will never construct, and nothing in the crate names
\* which machine was tested.
\*
\* GuardOn = TRUE, deliberately. The residue survives the departure guard that
\* has now landed on main — the guard
\* compares replay against discovery and here they agree, because both are the
\* wrong machine. This is the formal answer to "can the environment hazard be
\* closed structurally?", and the answer is no.

SPECIFICATION Spec

CONSTANTS
    DepthCaps  = {1, 3}
    WorldModes = {"prewarmed"}
    GuardOn    = TRUE
    Narrow     = TRUE
    WarmStart  = "w0"

INVARIANT ReplayIsConsistent
