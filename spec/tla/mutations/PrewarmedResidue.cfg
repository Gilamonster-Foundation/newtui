\* EXPECT-RED: CoversColdReach
\*
\* THE RESIDUE, red half. A PERMANENT red, by design, and it is the reason it
\* lives here rather than in the discovered directory: it is not a defect to be
\* fixed, it is the excluded-site set, countable and monotonically shrinking.
\*
\* GuardOn = TRUE — the S0 departure guard is ON and does not help. Discovery
\* and replay agree because both are the wrong machine. ../PrewarmedConsistent.cfg
\* is this same configuration asserting ReplayIsConsistent, and it is GREEN.

SPECIFICATION Spec

CONSTANTS
    DepthCaps  = {1, 3}
    WorldModes = {"prewarmed"}
    GuardOn    = TRUE
    Narrow     = TRUE
    WarmStart  = "w0"

INVARIANT CoversColdReach
