\* EXPECT-RED: ExhaustedOnlyNarrows
\*
\* BUG 1, FIXED at 5307cd7. This is its regression gate, and it has value only
\* because scripts/check-mutations.sh executes it: a hand-run mutation table
\* rots, and this repository has already lost that bet once (3a landed one
\* commit after the fix that created the flag).
\*
\* `Narrow = FALSE` is the pre-fix `=` at explore.rs:280 in place of `&=`:
\* the terminal assignment erases the `exhausted = false` recorded by the depth
\* arm at :214, and a depth-capped run reports `exhausted: true`.
\*
\* DepthCaps = {1}: at cap 1 the depth arm fires. At cap 3 it never does and
\* the mutation is invisible.

SPECIFICATION Spec

CONSTANTS
    DepthCaps  = {1}
    WorldModes = {"free"}
    GuardOn    = FALSE
    Narrow     = FALSE
    WarmStart  = "w0"

PROPERTY ExhaustedOnlyNarrows
