\* EXPECT-RED: ClaimSurvives
\*
\* THE ANTI-VACUITY PROBE. `ClaimSurvives` asserts that NO honest exhaustive
\* run is reachable. It must be RED, and its counterexample is a trace ending
\* in `done /\ exhausted /\ judged covers ReachOf("p0")`.
\*
\* If this ever goes green, every green in ../ is vacuous: the invariants would
\* be holding because their antecedent `done /\ exhausted` is unreachable, not
\* because the search is honest. That is the question to ask of any passing
\* check — what would it do if the thing it measures did not exist?

SPECIFICATION Spec

