\* EXPECT-RED: ModelMatchesRust
\*
\* THE DRAIN BINDING IS LOAD-BEARING. Without this row, extending the bridge to
\* "drain" would be a claim with no evidence: every shipped cfg that binds it
\* is green, and green is what a binding that constrains nothing also looks
\* like.
\*
\* The mutation is the model describing the crate BEFORE the departure guard —
\* `GuardOn = FALSE` in the world the guard exists for. The model then judges
\* on from a departure it never checked and reports the counters of the machine
\* it drifted into; the Rust in `spec/tla/lib/RustObs.tla` recorded a
\* divergence, judged nothing past it, and reported one state and no
\* transitions. Those cannot both be true of one implementation, and
\* `ModelMatchesRust` is what says so.
\*
\* Note which side has to be wrong for this to fire. `check-model.sh`
\* regenerates only the RUST side, so a model that has drifted stays red after
\* regeneration — it cannot heal into "somebody edited the number to match".
\* This row is the executed proof of that for the world the guard governs.

SPECIFICATION Spec

CONSTANTS
    DepthCaps  = {3}
    WorldModes = {"drain"}
    GuardOn    = FALSE
    Narrow     = TRUE
    WarmStart  = "w0"

INVARIANT ModelMatchesRust
