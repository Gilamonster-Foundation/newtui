\* EXPECT-GREEN: the w0-unreachable decoy is load-bearing
\*
\* A NEGATIVE CONTROL, and the only EXPECT-GREEN entry here. This is
\* ReplayGuardOff.cfg with ONE change: `WarmStart = "p0"`, which removes the
\* decoy by making the warm machine the cold machine. The bug is still
\* "present" (GuardOn = FALSE, world "drain") and CoversColdReach goes GREEN.
\*
\* That is the point. It shows the red next door depends on the two machines
\* being distinguishable, so a future "tidy-up" that overlaps them would turn
\* the 3b detector blind while every gate stayed green. Deleting this file
\* deletes the evidence that the decoy matters.

SPECIFICATION Spec

CONSTANTS
    DepthCaps  = {3}
    WorldModes = {"drain"}
    GuardOn    = FALSE
    Narrow     = TRUE
    WarmStart  = "p0"

INVARIANT CoversColdReach
