\* Bug 1 (5307cd7) as a two-state relation, in its OWN cfg.
\*
\* `exhausted` may go TRUE -> FALSE and never back. This is a PROPERTY, not an
\* INVARIANT: the defect was an ASSIGNMENT that undid an earlier one, and no
\* predicate over a single state can see that.
\*
\* SEPARATE CFG ON PURPOSE. Run beside CoversColdReach, the stronger invariant
\* fires first on the bug-1 mutation and masks it — the mutation runner asserts
\* that the EXPECTED invariant name appears in TLC's output, and a red for the
\* wrong reason is a green in disguise.
\*
\* Green here; RED at mutations/NarrowOff.cfg, which is the same configuration
\* with `Narrow = FALSE` (the pre-5307cd7 `=` at explore.rs:280).

SPECIFICATION Spec

CONSTANTS
    DepthCaps  = {1, 3}
    WorldModes = {"free", "drain"}
    GuardOn    = FALSE
    Narrow     = TRUE
    WarmStart  = "w0"

PROPERTY ExhaustedOnlyNarrows
