\* The departure guard closes shape A of bug 3b.
\*
\* Same worlds as mutations/ReplayGuardOff.cfg — {"free","drain"} — and the
\* ONLY difference is `GuardOn`. That cfg is RED on CoversColdReach; this one
\* is GREEN. The pair is the whole argument that the guard is load-bearing,
\* and both halves are executed rather than asserted in prose.
\*
\* This described code that did not exist when it was written. It does now:
\* `Departure { path, expected }` is the queue entry carrying the fingerprint
\* recorded at discovery, and `Explorer::replay_to` is the comparison. The
\* correspondence is no longer a promise — ExplorerReplay.cfg binds the same
\* two worlds to a real `Explorer::explore` run through the bridge, and
\* mutations/BridgeBindsDrain.cfg is the executed proof that the binding
\* constrains rather than merely being present.
\*
\* Note WHY this is green in "drain" now. The model records the departure in
\* `diverged` and judges nothing further, exactly as the crate does, and
\* `CoversColdReach` asks for `~diverged` — so the guarded run does not make
\* the coverage claim at all rather than making it and being right. That is
\* the crate's own answer: a diverged report is `Incomplete`, and its silence
\* is not evidence. The green half of this pair is therefore a REFUSAL to
\* claim, and mutations/ReplayGuardOff.cfg is the same world making the claim
\* falsely. The pair is the argument; neither half is it alone.
\*
\* It closes shape A ONLY: a replay that departs at the first step. A
\* divergence deeper inside the replay whose prefix replays identically is not
\* modelled, and PrewarmedConsistent.cfg + mutations/PrewarmedResidue.cfg are
\* the executed statement that a whole family survives the guard.

SPECIFICATION Spec

CONSTANTS
    DepthCaps  = {1, 3}
    WorldModes = {"free", "drain"}
    GuardOn    = TRUE
    Narrow     = TRUE
    WarmStart  = "w0"

INVARIANT CoversColdReach
